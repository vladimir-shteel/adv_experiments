name: Deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Владелец всех приватных репозиториев-источников
  OWNER: vladimir-shteel

  # ─────────────────────────────────────────────────────────────
  #  СПИСОК ПРОТОТИПОВ.  Чтобы добавить ещё один — допиши одну строку:
  #      имя-страницы | репозиторий | ветка
  #  (пробелы вокруг | не важны, выравнивай как удобно)
  # ─────────────────────────────────────────────────────────────
  PROTOTYPES: |
    fighting-dudes | FightingDudes  | codex/fmfm-b-garrison-buff
    dice-lords          | DiceLordEredan | main
    dice-lords-original | DiceLordEredan | original_idea
    dice-lords-heroes   | DiceLordEredan | turn_based_heroes
    dice-lords-waves    | DiceLordEredan | wave_phases
    dice-lords-endless  | DiceLordEredan | endless_accumulation
    bagtd               | PBBTD          | master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Витрина (лендинг index.html лежит в этом же репозитории)
      - name: Checkout showcase
        uses: actions/checkout@v4

      - name: Assemble site
        env:
          TOKEN: ${{ secrets.PRIVATE_REPOS_PAT }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html

          while IFS='|' read -r page repo ref; do
            # обрезаем пробелы по краям
            page="$(echo "$page" | xargs || true)"
            repo="$(echo "$repo" | xargs || true)"
            ref="$(echo "$ref"  | xargs || true)"
            [ -z "$page" ] && continue   # пропускаем пустые строки

            echo "→ $page  ($OWNER/$repo @ $ref)"
            git clone --depth 1 --branch "$ref" --quiet \
              "https://x-access-token:${TOKEN}@github.com/${OWNER}/${repo}.git" \
              "_site/$page"
            rm -rf "_site/$page/.git"
          done <<< "$PROTOTYPES"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
